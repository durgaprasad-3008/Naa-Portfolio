<!--
  PASTE THIS into the EmailJS template editor.

  1. Go to https://dashboard.emailjs.com/admin/templates
  2. Click "Create New Template"
  3. Switch the editor to "Code" view (top-right toggle)
  4. Paste this whole HTML below
  5. In the template settings:
     - "To Email":     durgaprasadmudhiraj1267@gmail.com
     - "From Name":    {{from_name}}
     - "Reply To":     {{from_email}}
     - "Subject":      New portfolio message from {{from_name}}
  6. Save, copy the Template ID, and put it in .env as VITE_EMAILJS_TEMPLATE_ID

  Template variables used:  {{from_name}}, {{from_email}}, {{message}}, {{to_name}}
-->

<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0a0a0a;font-family:Arial,Helvetica,sans-serif;color:#e5e7eb;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;padding:40px 20px;">
      <tr>
        <td align="center">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#111;border:1px solid rgba(239,68,68,0.25);border-radius:18px;overflow:hidden;">

            <!-- HEADER -->
            <tr>
              <td style="background:linear-gradient(135deg,#dc2626 0%,#7f1d1d 100%);padding:28px 32px;">
                <p style="margin:0 0 6px 0;font-size:11px;letter-spacing:5px;color:#fecaca;text-transform:uppercase;">
                  Portfolio Inbox
                </p>
                <h1 style="margin:0;font-size:24px;color:#ffffff;line-height:1.3;">
                  Hey {{to_name}}, you have a new message from your portfolio
                </h1>
              </td>
            </tr>

            <!-- BODY -->
            <tr>
              <td style="padding:28px 32px;">

                <p style="margin:0 0 18px 0;font-size:15px;color:#d1d5db;line-height:1.6;">
                  Someone just reached out through your portfolio contact form.
                </p>

                <!-- SENDER INFO -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.18);border-radius:12px;padding:18px;margin-bottom:22px;">
                  <tr>
                    <td style="padding:8px 0;font-size:14px;">
                      <span style="display:inline-block;min-width:15px;color:#9ca3af;font-size:13px;">From :</span>
                      &nbsp;&nbsp;&nbsp;&nbsp;
                      <span style="color:#ffffff;font-weight:600;">{{from_name}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:8px 0;font-size:14px;">
                      <span style="display:inline-block;min-width:15px;color:#9ca3af;font-size:13px;">Email :</span>
                      &nbsp;&nbsp;&nbsp;&nbsp;
                      <a href="mailto:{{from_email}}" style="color:#449cef;text-decoration:none;">{{from_email}}</a>
                    </td>
                  </tr>
                </table>

                <!-- MESSAGE LABEL -->
                <p style="margin:0 0 10px 0;font-size:11px;letter-spacing:4px;color:#ef4444;text-transform:uppercase;">
                  Message
                </p>

                <!-- MESSAGE BODY -->
                <div style="background:#000000;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;font-size:14px;color:#e5e7eb;line-height:1.7;white-space:pre-wrap;">
                  {{message}}
                </div>

                <!-- REPLY BUTTON -->
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:26px;">
                  <tr>
                    <td style="border-radius:10px;background:#dc2626;">
                      <a href="mailto:{{from_email}}" style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:10px;">
                        Reply to {{from_name}}
                      </a>
                    </td>
                  </tr>
                </table>

              </td>
            </tr>

            <!-- FOOTER -->
            <tr>
              <td style="border-top:1px solid rgba(255,255,255,0.06);padding:18px 32px;background:#0a0a0a;">
                <p style="margin:0;font-size:12px;color:#6b7280;text-align:center;">
                  Sent automatically from your portfolio contact form
                </p>
              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>

  </body>
</html>
